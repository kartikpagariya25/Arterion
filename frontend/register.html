<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Arterion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&family=Bricolage+Grotesque:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/theme.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
  .auth-shell{max-width:520px; margin:0 auto;}
  .auth-card{padding:38px;}
  .auth-card h2{font-size:1.4rem; font-weight:700; margin-bottom:8px;}
  .auth-card .sub{color:var(--ink-soft); font-size:.88rem; margin-bottom:26px;}
  .form-group{margin-bottom:18px;}
  .form-group label{display:block; font-size:.86rem; font-weight:600; margin-bottom:8px; color:var(--ink);}
  .form-group input, .form-group select{
    width:100%; padding:13px 16px; border-radius:12px; border:1.5px solid var(--pink-200);
    font-family:inherit; font-size:.92rem; background:var(--blush-50); transition:border-color .2s ease;
  }
  .form-group input:focus, .form-group select:focus{outline:none; border-color:var(--maroon-600);}
  .form-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .role-toggle{display:flex; gap:12px; margin-bottom:22px;}
  .role-option{flex:1; text-align:center; padding:16px; border-radius:12px; border:1.5px solid var(--pink-200); cursor:pointer; font-weight:600; font-size:.9rem; transition:all .2s ease;}
  .role-option.active{border-color:var(--maroon-600); background:var(--blush-50); color:var(--wine-800);}
  .role-option i{display:block; font-size:1.2rem; margin-bottom:6px;}
  .auth-switch{text-align:center; margin-top:20px; font-size:.88rem; color:var(--ink-soft);}
  .auth-switch a{color:var(--wine-800); font-weight:600;}
  .auth-error{display:none; background:#fde8e8; color:#b42318; border-radius:10px; padding:12px 16px; font-size:.85rem; margin-bottom:18px;}
  .doctor-fields, .patient-fields{display:none;}
  @media (max-width:600px){.form-row{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="page-wrap">
  <section class="top-card">
    <div id="nav-mount"></div>
    <div class="page-title-block">
      <h1 class="reveal">Create Your Account</h1>
      <p class="reveal">Register as a doctor or patient to start using Arterion.</p>
    </div>
  </section>
</div>

<section class="section-pad">
  <div class="container auth-shell">
    <div class="card auth-card reveal">
      <h2>Register</h2>
      <p class="sub">Tell us a bit about yourself.</p>
      <div class="auth-error" id="authError"></div>

      <div class="role-toggle">
        <div class="role-option active" data-role="patient"><i class="fa-solid fa-user"></i>Patient</div>
        <div class="role-option" data-role="doctor"><i class="fa-solid fa-user-doctor"></i>Doctor</div>
      </div>

      <form id="registerForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="fullName" placeholder="Your full name" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Min. 8 characters" minlength="8" required>
          </div>
        </div>

        <div class="patient-fields" style="display:grid;">
          <div class="form-row">
            <div class="form-group">
              <label>Age</label>
              <input type="number" id="age" placeholder="e.g. 45" min="1" max="120">
            </div>
            <div class="form-group">
              <label>Gender</label>
              <select id="gender">
                <option value="">Select</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="phone" placeholder="Your phone number">
          </div>
        </div>

        <div class="doctor-fields">
          <div class="form-group">
            <label>Hospital / Clinic Name</label>
            <input type="text" id="hospitalName" placeholder="Where you practice">
          </div>
          <div class="form-group">
            <label>Medical Registration / License Number <span style="font-weight:400; color:var(--ink-soft);">(optional)</span></label>
            <input type="text" id="licenseNumber" placeholder="e.g. MH-12345">
          </div>
        </div>

        <button type="submit" class="btn btn-solid" style="width:100%;" id="registerBtn"><i class="fa-solid fa-user-plus"></i> Create Account</button>
      </form>
      <div class="auth-switch">Already have an account? <a href="login.html">Log in here</a></div>
    </div>
  </div>
</section>

<footer><div id="footer-mount"></div></footer>
<div id="emergency-mount"></div>
<script src="js/auth.js"></script>
<script src="js/common.js"></script>
<script>
  let selectedRole = "patient";

  document.querySelectorAll(".role-option").forEach((opt) => {
    opt.addEventListener("click", () => {
      document.querySelectorAll(".role-option").forEach((o) => o.classList.remove("active"));
      opt.classList.add("active");
      selectedRole = opt.dataset.role;
      document.querySelector(".patient-fields").style.display = selectedRole === "patient" ? "grid" : "none";
      document.querySelector(".doctor-fields").style.display = selectedRole === "doctor" ? "block" : "none";
    });
  });

  document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errBox = document.getElementById("authError");
    errBox.style.display = "none";
    const btn = document.getElementById("registerBtn");
    btn.disabled = true;
    btn.textContent = "Creating account...";

    const payload = {
      full_name: document.getElementById("fullName").value,
      email: document.getElementById("email").value,
      password: document.getElementById("password").value,
      role: selectedRole,
    };

    if (selectedRole === "patient") {
      payload.age = document.getElementById("age").value ? Number(document.getElementById("age").value) : null;
      payload.gender = document.getElementById("gender").value || null;
      payload.phone = document.getElementById("phone").value || null;
    } else {
      payload.hospital_name = document.getElementById("hospitalName").value || null;
      payload.license_number = document.getElementById("licenseNumber").value || null;
    }

    try {
      const res = await fetch(`${API_BASE}/auth/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Registration failed");

      saveSession(data.token, data.user);
      window.location.href = "dashboard.html";
    } catch (err) {
      errBox.textContent = err.message || "Something went wrong. Please try again.";
      errBox.style.display = "block";
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create Account';
    }
  });
</script>
</body>
</html>
